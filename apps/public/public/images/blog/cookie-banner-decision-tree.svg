<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 412" width="720" height="412" role="img" aria-labelledby="title">
  <title id="title">Do you need a cookie banner for analytics?</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0c6b69"/>
    </marker>
  </defs>
  <rect width="720" height="412" rx="12" fill="#f5f9f9"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="40" y="40" font-size="18" font-weight="700" fill="#0f1719">Need a cookie banner?</text>

    <rect x="40" y="60" width="400" height="60" rx="12" fill="#e2f0ef" stroke="#d3e0de"/>
    <text x="240" y="86" text-anchor="middle" font-size="16" font-weight="600" fill="#0f1719">Does your analytics use cookies?</text>
    <text x="240" y="106" text-anchor="middle" font-size="15" fill="#5d6d73">or any device storage</text>

    <rect x="40" y="152" width="400" height="60" rx="12" fill="#e2f0ef" stroke="#d3e0de"/>
    <text x="240" y="178" text-anchor="middle" font-size="16" font-weight="600" fill="#0f1719">Do other tags use cookies?</text>
    <text x="240" y="198" text-anchor="middle" font-size="15" fill="#5d6d73">ads, chat, video embeds</text>

    <rect x="40" y="244" width="400" height="60" rx="12" fill="#e2f0ef" stroke="#d3e0de"/>
    <text x="240" y="270" text-anchor="middle" font-size="16" font-weight="600" fill="#0f1719">Do local rules require consent?</text>
    <text x="240" y="290" text-anchor="middle" font-size="15" fill="#5d6d73">in your visitors' countries</text>

    <rect x="40" y="336" width="400" height="56" rx="12" fill="#ffffff" stroke="#0c6b69" stroke-width="2"/>
    <text x="240" y="360" text-anchor="middle" font-size="17" font-weight="700" fill="#0c6b69">Often no banner needed</text>
    <text x="240" y="381" text-anchor="middle" font-size="15" fill="#5d6d73">GDPR still applies</text>

    <rect x="512" y="60" width="176" height="244" rx="12" fill="#ffffff" stroke="#0c6b69" stroke-width="2"/>
    <text x="600" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1719">Banner needed</text>
    <text x="600" y="200" text-anchor="middle" font-size="15" fill="#5d6d73">consent first</text>

    <g stroke="#0c6b69" stroke-width="2" marker-end="url(#arrow)">
      <line x1="440" y1="90" x2="510" y2="90"/>
      <line x1="440" y1="182" x2="510" y2="182"/>
      <line x1="440" y1="274" x2="510" y2="274"/>
      <line x1="240" y1="120" x2="240" y2="150"/>
      <line x1="240" y1="212" x2="240" y2="242"/>
      <line x1="240" y1="304" x2="240" y2="334"/>
    </g>

    <g font-size="15" font-weight="600" fill="#0c6b69">
      <text x="475" y="82" text-anchor="middle">Yes</text>
      <text x="475" y="174" text-anchor="middle">Yes</text>
      <text x="475" y="266" text-anchor="middle">Yes</text>
      <text x="252" y="141">No</text>
      <text x="252" y="233">No</text>
      <text x="252" y="325">No</text>
    </g>
  </g>
</svg>
