<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 408" width="720" height="408" role="img" aria-labelledby="t" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Analytics requests without and with a first-party proxy</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0c6b69"/>
    </marker>
  </defs>
  <rect width="720" height="408" fill="#ffffff"/>

  <!-- Without a proxy -->
  <rect x="16" y="16" width="688" height="180" rx="12" fill="#f5f9f9"/>
  <text x="36" y="46" font-size="17" font-weight="700" fill="#0c6b69">Without a proxy</text>

  <rect x="36" y="84" width="150" height="72" rx="12" fill="#e2f0ef" stroke="#d3e0de"/>
  <text x="111" y="114" font-size="17" font-weight="600" fill="#0f1719" text-anchor="middle">Browser</text>
  <text x="111" y="138" font-size="15" fill="#5d6d73" text-anchor="middle">with ad blocker</text>

  <rect x="460" y="62" width="228" height="50" rx="12" fill="#e2f0ef" stroke="#d3e0de"/>
  <text x="574" y="92" font-size="16" fill="#0f1719" text-anchor="middle">privytics.com/op1.js</text>
  <rect x="460" y="128" width="228" height="50" rx="12" fill="#e2f0ef" stroke="#d3e0de"/>
  <text x="574" y="158" font-size="16" fill="#0f1719" text-anchor="middle">api.privytics.com</text>

  <line x1="186" y1="108" x2="456" y2="87" stroke="#0c6b69" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="186" y1="132" x2="456" y2="153" stroke="#0c6b69" stroke-width="2" marker-end="url(#arrow)"/>

  <g stroke="#5d6d73" stroke-width="2" stroke-linecap="round">
    <circle cx="323" cy="97" r="12" fill="#ffffff"/>
    <line x1="318" y1="92" x2="328" y2="102"/>
    <line x1="328" y1="92" x2="318" y2="102"/>
    <circle cx="323" cy="143" r="12" fill="#ffffff"/>
    <line x1="318" y1="138" x2="328" y2="148"/>
    <line x1="328" y1="138" x2="318" y2="148"/>
  </g>
  <text x="323" y="182" font-size="15" fill="#5d6d73" text-anchor="middle">Blocker can cut both</text>

  <!-- With a proxy -->
  <rect x="16" y="212" width="688" height="180" rx="12" fill="#f5f9f9"/>
  <text x="36" y="242" font-size="17" font-weight="700" fill="#0c6b69">With a proxy</text>

  <rect x="36" y="280" width="150" height="72" rx="12" fill="#e2f0ef" stroke="#d3e0de"/>
  <text x="111" y="310" font-size="17" font-weight="600" fill="#0f1719" text-anchor="middle">Browser</text>
  <text x="111" y="334" font-size="15" fill="#5d6d73" text-anchor="middle">with ad blocker</text>

  <rect x="236" y="262" width="170" height="108" rx="12" fill="#e2f0ef" stroke="#d3e0de"/>
  <text x="321" y="292" font-size="16" font-weight="600" fill="#0f1719" text-anchor="middle">yourdomain.com</text>
  <text x="321" y="320" font-size="15" fill="#5d6d73" text-anchor="middle">/js/pv.js</text>
  <text x="321" y="344" font-size="15" fill="#5d6d73" text-anchor="middle">/pv/track</text>

  <rect x="566" y="280" width="122" height="72" rx="12" fill="#e2f0ef" stroke="#d3e0de"/>
  <text x="627" y="322" font-size="17" font-weight="600" fill="#0f1719" text-anchor="middle">Privytics</text>

  <line x1="186" y1="315" x2="232" y2="315" stroke="#0c6b69" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="186" y1="339" x2="232" y2="339" stroke="#0c6b69" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="406" y1="316" x2="562" y2="316" stroke="#0c6b69" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="486" y="284" font-size="15" fill="#0f1719" text-anchor="middle">+ visitor IP</text>
  <text x="486" y="304" font-size="15" fill="#0f1719" text-anchor="middle">+ User-Agent</text>
  <text x="486" y="340" font-size="15" fill="#5d6d73" text-anchor="middle">no cookies</text>
</svg>
