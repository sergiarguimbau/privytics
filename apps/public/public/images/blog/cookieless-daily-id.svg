<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 304" width="720" height="304" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">How cookieless analytics counts a visitor</title>
  <desc id="desc">On Monday, a visit reaches the analytics server, which mixes the IP, browser and site with Monday's secret into the anonymous ID a3f9. On Tuesday, the same visitor gets the ID 7c21 from Tuesday's secret. The two IDs cannot be linked, and nothing is stored on the visitor's device.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0c6b69"/>
    </marker>
  </defs>

  <rect width="720" height="304" rx="12" fill="#f5f9f9"/>

  <text x="116" y="44" text-anchor="middle" font-size="15" font-weight="600" fill="#5d6d73">Visitor's device</text>
  <text x="372" y="44" text-anchor="middle" font-size="15" font-weight="600" fill="#5d6d73">Analytics server</text>
  <text x="616" y="44" text-anchor="middle" font-size="15" font-weight="600" fill="#5d6d73">Anonymous ID</text>

  <rect x="32" y="64" width="168" height="80" rx="12" fill="#ffffff" stroke="#d3e0de"/>
  <text x="116" y="98" text-anchor="middle" font-size="16" font-weight="600" fill="#0f1719">Monday visit</text>
  <text x="116" y="122" text-anchor="middle" font-size="15" fill="#5d6d73">Nothing stored</text>

  <line x1="200" y1="104" x2="252" y2="104" stroke="#0c6b69" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="256" y="64" width="232" height="80" rx="12" fill="#e2f0ef" stroke="#d3e0de"/>
  <text x="372" y="98" text-anchor="middle" font-size="16" fill="#0f1719">IP + browser + site</text>
  <text x="372" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#0c6b69">+ Monday's secret</text>

  <line x1="488" y1="104" x2="540" y2="104" stroke="#0c6b69" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="544" y="64" width="144" height="80" rx="12" fill="#ffffff" stroke="#d3e0de"/>
  <text x="616" y="110" text-anchor="middle" font-size="18" font-weight="600" fill="#0c6b69">a3f9</text>

  <line x1="616" y1="150" x2="616" y2="194" stroke="#5d6d73" stroke-width="2" stroke-dasharray="4 4"/>
  <g stroke="#5d6d73" stroke-width="2" stroke-linecap="round">
    <circle cx="616" cy="172" r="11" fill="#ffffff"/>
    <line x1="611" y1="167" x2="621" y2="177"/>
    <line x1="621" y1="167" x2="611" y2="177"/>
  </g>
  <text x="594" y="177" text-anchor="end" font-size="15" fill="#5d6d73">Cannot be linked</text>

  <rect x="32" y="200" width="168" height="80" rx="12" fill="#ffffff" stroke="#d3e0de"/>
  <text x="116" y="234" text-anchor="middle" font-size="16" font-weight="600" fill="#0f1719">Tuesday visit</text>
  <text x="116" y="258" text-anchor="middle" font-size="15" fill="#5d6d73">Nothing stored</text>

  <line x1="200" y1="240" x2="252" y2="240" stroke="#0c6b69" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="256" y="200" width="232" height="80" rx="12" fill="#e2f0ef" stroke="#d3e0de"/>
  <text x="372" y="234" text-anchor="middle" font-size="16" fill="#0f1719">IP + browser + site</text>
  <text x="372" y="258" text-anchor="middle" font-size="15" font-weight="600" fill="#0c6b69">+ Tuesday's secret</text>

  <line x1="488" y1="240" x2="540" y2="240" stroke="#0c6b69" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="544" y="200" width="144" height="80" rx="12" fill="#ffffff" stroke="#d3e0de"/>
  <text x="616" y="246" text-anchor="middle" font-size="18" font-weight="600" fill="#0c6b69">7c21</text>
</svg>
