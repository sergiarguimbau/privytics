<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 348" width="720" height="348" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">Web analytics versus product analytics</title>
  <desc id="desc">Web analytics counts visits: which pages people read, where visitors came from and how many came. Product analytics follows each user over time: they sign up, create a project on day 1 and come back in week 2, which is measured for signed-in users.</desc>

  <rect width="720" height="348" rx="12" fill="#f5f9f9"/>

  <rect x="24" y="24" width="324" height="300" rx="12" fill="#ffffff" stroke="#d3e0de"/>
  <text x="44" y="60" font-size="17" font-weight="600" fill="#0f1719">Web analytics</text>
  <text x="44" y="84" font-size="15" fill="#5d6d73">Counts visits</text>

  <rect x="40" y="100" width="292" height="56" rx="12" fill="#e2f0ef" stroke="#d3e0de"/>
  <text x="60" y="124" font-size="16" font-weight="600" fill="#0f1719">Pages</text>
  <text x="60" y="145" font-size="15" fill="#5d6d73">Which pages people read</text>

  <rect x="40" y="176" width="292" height="56" rx="12" fill="#e2f0ef" stroke="#d3e0de"/>
  <text x="60" y="200" font-size="16" font-weight="600" fill="#0f1719">Sources</text>
  <text x="60" y="221" font-size="15" fill="#5d6d73">Where visitors came from</text>

  <rect x="40" y="252" width="292" height="56" rx="12" fill="#e2f0ef" stroke="#d3e0de"/>
  <text x="60" y="276" font-size="16" font-weight="600" fill="#0f1719">Visits</text>
  <text x="60" y="297" font-size="15" fill="#5d6d73">How many people came</text>

  <rect x="372" y="24" width="324" height="300" rx="12" fill="#ffffff" stroke="#d3e0de"/>
  <text x="392" y="60" font-size="17" font-weight="600" fill="#0f1719">Product analytics</text>
  <text x="392" y="84" font-size="15" fill="#5d6d73">Follows each user over time</text>

  <rect x="388" y="100" width="292" height="56" rx="12" fill="#e2f0ef" stroke="#d3e0de"/>
  <text x="408" y="124" font-size="16" font-weight="600" fill="#0f1719">Signs up</text>
  <text x="408" y="145" font-size="15" fill="#5d6d73">Day 1</text>

  <line x1="534" y1="158" x2="534" y2="167" stroke="#0c6b69" stroke-width="2"/>
  <polygon points="528,166 540,166 534,174" fill="#0c6b69"/>

  <rect x="388" y="176" width="292" height="56" rx="12" fill="#e2f0ef" stroke="#d3e0de"/>
  <text x="408" y="200" font-size="16" font-weight="600" fill="#0f1719">Creates a project</text>
  <text x="408" y="221" font-size="15" fill="#5d6d73">Day 1</text>

  <line x1="534" y1="234" x2="534" y2="243" stroke="#0c6b69" stroke-width="2"/>
  <polygon points="528,242 540,242 534,250" fill="#0c6b69"/>

  <rect x="388" y="252" width="292" height="56" rx="12" fill="#e2f0ef" stroke="#d3e0de"/>
  <text x="408" y="276" font-size="16" font-weight="600" fill="#0f1719">Comes back</text>
  <text x="408" y="297" font-size="15" fill="#0c6b69">Week 2, signed-in users</text>
</svg>
